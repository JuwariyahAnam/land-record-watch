name: daily-land-check
on:
  schedule:
    - cron: "30 1 * * *"   # 07:00 IST
  workflow_dispatch: {}
concurrency: land-check
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12", cache: pip }
      - run: pip install -r requirements.txt
      - name: Restore the agent database
        uses: actions/cache@v4
        with:
          path: data/watch.db
          key: watch-db-${{ github.run_id }}
          restore-keys: watch-db-
      - name: Run the check
        env:
          SOURCE: portal
          PORTAL_BASE: ${{ secrets.PORTAL_BASE }}
          PARCEL_SOURCE_REF: ${{ secrets.PARCEL_SOURCE_REF }}
          PARCEL_CHAT_ID: ${{ secrets.PARCEL_CHAT_ID }}
          PARCEL_LANGUAGE: ${{ vars.PARCEL_LANGUAGE || 'en' }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          BROWSERBASE_API_KEY: ${{ secrets.BROWSERBASE_API_KEY }}
          BROWSERBASE_PROJECT_ID: ${{ secrets.BROWSERBASE_PROJECT_ID }}
          DEV_NO_BROWSER: ${{ vars.DEV_NO_BROWSER || '0' }}
          BB_MAX_SESSIONS_PER_DAY: "5"
        run: |
          python -m src.seed_parcel
          python -m src.main --once
