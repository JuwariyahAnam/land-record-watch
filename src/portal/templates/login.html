{% extends "base.html" %}
{% block title %}Log in{% endblock %}
{% block body %}
<div class="narrow">
<h1>Log in{% if role %} as {{ role }}{% endif %}</h1>
<form class="card mt16" method="post">
  <input type="hidden" name="csrf" value="{{ csrf }}">
  <label for="email">Email</label><input id="email" name="email" type="email" required autocomplete="username">
  <label for="password">Password</label><input id="password" name="password" type="password" required autocomplete="current-password">
  <div class="row"><button class="btn" type="submit">Log in</button></div>
</form>
<p class="meta">New here? <a href="{{ url_for('register', role=role or 'landlord') }}">Create an account</a></p>
</div>
{% endblock %}
