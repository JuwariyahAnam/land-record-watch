services:
  - type: web
    name: land-record-registry
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn "src.portal.app:get_app()" --bind 0.0.0.0:$PORT --workers 1
    healthCheckPath: /healthz
    envVars:
      - { key: PYTHON_VERSION, value: "3.12.7" }
      - { key: PORTAL_HTTPS, value: "1" }
      - { key: PORTAL_SECRET_KEY, generateValue: true }
      - { key: PORTAL_SETUP_CODE, generateValue: true }
      - { key: PORTAL_DEMO_TOKEN, sync: false }
