<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Land Record Watch</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600;9..144,700&family=Inter:wght@400;500;600&family=Noto+Sans+Kannada:wght@400;600&family=Noto+Sans+Devanagari:wght@400;600&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#f3f7f2;--card:#fff;--ink:#12261a;--muted:#5b7063;--line:#dbe6dc;
  --green:#1d4d33;--green-2:#2f7a4f;--mint:#e3f2e7;--mint-2:#c9e6d2;
  --crit:#b42318;--crit-bg:#fdeceb;--high:#b45309;--high-bg:#fff1dc;--med:#1d4d33;--med-bg:#e3f2e7;--ops:#475467;--ops-bg:#eceff3;
  --sim:#7a5b00;--sim-bg:#fff4cc;--shadow:0 1px 2px rgba(18,38,26,.06),0 8px 24px rgba(18,38,26,.07);
}
:root[data-theme=dark]{
  --bg:#0d1711;--card:#14231a;--ink:#e8f1ea;--muted:#9fb5a6;--line:#244032;
  --green:#6fd09a;--green-2:#4fb27b;--mint:#183626;--mint-2:#22513a;
  --crit:#ff8a80;--crit-bg:#3a1714;--high:#ffbd66;--high-bg:#3a2810;--med:#6fd09a;--med-bg:#183626;--ops:#b7c2cf;--ops-bg:#232c36;
  --sim:#ffd666;--sim-bg:#3a3010;--shadow:none;
}
@media (prefers-color-scheme:dark){:root:not([data-theme=light]){
  --bg:#0d1711;--card:#14231a;--ink:#e8f1ea;--muted:#9fb5a6;--line:#244032;
  --green:#6fd09a;--green-2:#4fb27b;--mint:#183626;--mint-2:#22513a;
  --crit:#ff8a80;--crit-bg:#3a1714;--high:#ffbd66;--high-bg:#3a2810;--med:#6fd09a;--med-bg:#183626;--ops:#b7c2cf;--ops-bg:#232c36;
  --sim:#ffd666;--sim-bg:#3a3010;--shadow:none;}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.55 Inter,"Noto Sans Kannada","Noto Sans Devanagari",system-ui,sans-serif;
  background-image:radial-gradient(900px 380px at 50% -120px,var(--mint-2),transparent 70%)}
.wrap{max-width:1160px;margin:0 auto;padding:16px max(16px,env(safe-area-inset-left)) 56px}
header{display:flex;align-items:center;gap:12px;padding:6px 0 18px;flex-wrap:wrap}
.logo{width:44px;height:44px;border-radius:14px;background:var(--green);display:grid;place-items:center;flex:none}
.logo svg{width:24px;height:24px;stroke:#fff;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
header h1{font:700 18px/1.2 Fraunces,serif;margin:0}
header p{margin:0;font-size:12.5px;color:var(--muted)}
.tools{margin-left:auto;display:flex;gap:6px;align-items:center}
.seg{display:flex;background:var(--card);border:1px solid var(--line);border-radius:999px;padding:3px}
.seg button{border:0;background:none;color:var(--muted);font:600 12.5px inherit;font-family:inherit;padding:6px 10px;border-radius:999px;cursor:pointer}
.seg button[aria-pressed=true]{background:var(--green);color:var(--card)}
.icon{border:1px solid var(--line);background:var(--card);color:var(--ink);width:34px;height:34px;border-radius:50%;cursor:pointer;font-size:15px}
.pill{display:inline-flex;gap:7px;align-items:center;font:600 11.5px/1 Inter;letter-spacing:.08em;text-transform:uppercase;color:var(--green);background:var(--mint);padding:8px 12px;border-radius:999px}
.pill i{width:7px;height:7px;border-radius:50%;background:var(--green-2);box-shadow:0 0 0 0 var(--green-2);animation:pulse 2s infinite}
@keyframes pulse{70%{box-shadow:0 0 0 8px transparent}}
@media (prefers-reduced-motion:reduce){.pill i{animation:none}*{transition:none!important}}
.hero h2{font:700 clamp(30px,8vw,40px)/1.1 Fraunces,serif;margin:16px 0 10px;letter-spacing:-.01em}
.hero p{margin:0 0 22px;color:var(--muted)}
.card{background:var(--card);border:1px solid var(--line);border-radius:22px;box-shadow:var(--shadow);overflow:hidden;margin-bottom:16px}
.sketch{height:104px;background:var(--mint);position:relative}
.sketch svg{width:100%;height:100%;display:block}
.pad{padding:18px 20px}
.eyebrow{font:600 11.5px/1 Inter;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin:0 0 8px}
.pid{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.pid b{font:700 22px Fraunces,serif}
.tag{font:600 11px/1 Inter;padding:5px 8px;border-radius:6px;background:var(--ops-bg);color:var(--ops)}
.tag.sim{background:var(--sim-bg);color:var(--sim)}
.meta{color:var(--muted);font-size:14px;margin:6px 0 0}
.row{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:14px 20px;border-top:1px solid var(--line);font-size:14.5px}
.row span:first-child{color:var(--muted)}
.status{border-radius:18px;padding:16px 18px;margin:0 16px 16px;display:flex;gap:12px}
.status .dot{width:36px;height:36px;border-radius:50%;flex:none;display:grid;place-items:center;font-weight:700}
.status h3{margin:0 0 3px;font:700 17px Fraunces,serif}
.status p{margin:0;font-size:14.5px}
.s-medium{background:var(--med-bg)}.s-medium .dot{background:var(--green);color:var(--card)}
.s-high{background:var(--high-bg)}.s-high .dot{background:var(--high);color:var(--card)}
.s-critical{background:var(--crit-bg)}.s-critical .dot{background:var(--crit);color:var(--card)}
.s-ops{background:var(--ops-bg)}.s-ops .dot{background:var(--ops);color:var(--card)}
.s-none{background:var(--mint)}.s-none .dot{background:var(--green-2);color:var(--card)}
.btn{display:flex;width:calc(100% - 32px);margin:0 16px 16px;justify-content:center;gap:8px;align-items:center;border:0;cursor:pointer;
  background:var(--green);color:var(--card);font:600 16px Inter,"Noto Sans Kannada",sans-serif;padding:16px;border-radius:16px;transition:transform .15s}
.btn:hover{transform:translateY(-1px)}
:root[data-theme=dark] .btn{color:#0d1711}
@media (prefers-color-scheme:dark){:root:not([data-theme=light]) .btn{color:#0d1711}}
.btn:focus-visible,.icon:focus-visible,.seg button:focus-visible{outline:3px solid var(--green-2);outline-offset:2px}
.layout{max-width:560px;margin:0 auto}
@media (min-width:900px){
  .wrap{padding-top:28px}
  header{padding-bottom:30px}
  .layout{max-width:none;display:grid;grid-template-columns:minmax(0,1fr) minmax(0,520px);gap:64px;align-items:start}
  .hero{position:sticky;top:32px;padding-top:28px}
  .hero h2{font-size:clamp(46px,4.6vw,64px);line-height:1.05}
  .hero p{font-size:18px;max-width:30em}
  .note{max-width:560px}
  .sheet{align-items:center}
  .panel{border-radius:26px;max-width:640px;max-height:88vh;padding:24px 26px 30px}
}
/* detail sheet */
.sheet{position:fixed;inset:0;background:rgba(8,16,11,.5);display:none;align-items:flex-end;justify-content:center;z-index:5}
.sheet.open{display:flex}
.panel{background:var(--bg);width:100%;max-width:560px;max-height:92vh;overflow:auto;border-radius:26px 26px 0 0;padding:18px 18px 34px;animation:up .25s ease}
@keyframes up{from{transform:translateY(40px);opacity:0}}
.panel h3{font:700 22px Fraunces,serif;margin:4px 0 12px}
.close{float:right}
.chip{font:600 11.5px/1 Inter;padding:6px 10px;border-radius:999px;text-transform:uppercase;letter-spacing:.06em}
.c-medium{background:var(--med-bg);color:var(--med)}.c-high{background:var(--high-bg);color:var(--high)}
.c-critical{background:var(--crit-bg);color:var(--crit)}.c-ops{background:var(--ops-bg);color:var(--ops)}
.diff{display:grid;grid-template-columns:1fr auto 1fr;gap:8px;align-items:center;margin:8px 0}
.diff .b{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:10px 12px;font-size:14px}
.diff .b small{display:block;color:var(--muted);font-size:11.5px}
.diff .b.new{border-color:var(--green-2);background:var(--mint)}
.msg{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:14px 16px;font-size:15px;margin:10px 0}
.listen{background:none;border:1px solid var(--line);color:var(--ink);border-radius:999px;padding:8px 14px;cursor:pointer;font:600 13px inherit;font-family:inherit}
ol.tl{list-style:none;margin:8px 0 0;padding:0 0 0 18px;border-left:2px solid var(--line)}
ol.tl li{position:relative;margin:0 0 14px;font-size:14px}
ol.tl li:before{content:"";position:absolute;left:-25px;top:6px;width:10px;height:10px;border-radius:50%;background:var(--green-2)}
ol.tl small{color:var(--muted);display:block}
.note{font-size:13px;color:var(--muted);margin-top:18px;border-top:1px dashed var(--line);padding-top:14px}
.guard{display:flex;gap:8px;flex-wrap:wrap;margin:8px 0 0}
.guard span{font-size:12.5px;background:var(--mint);color:var(--green);padding:6px 10px;border-radius:999px}

@media (min-width:900px){
  .wrap{max-width:1160px;padding-top:28px}
  header{padding-bottom:36px}
  .layout{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,520px);gap:64px;align-items:start}
  .hero{position:sticky;top:32px;padding-top:24px}
  .hero h2{font-size:clamp(44px,5vw,64px);margin-top:22px}
  .hero p{font-size:18px;max-width:34ch}
  .sheet{align-items:center}
  .panel{max-width:640px;border-radius:26px;max-height:88vh}
  .note{text-align:center;max-width:640px;margin:40px auto 0}
}
</style>
</head>

  changes:[{type:"mutation_status_changed",id:"MR-1001",old:"Pending",new:"Recorded"}],
  messages:{en:"Alert for KA-DEMO-001: the public land record changed. Mutation entry MR-1001 changed from Pending to Recorded. This does not prove anything is wrong. Please check with your local land records office.",
   kn:"KA-DEMO-001 ಜಮೀನಿನ ಸಾರ್ವಜನಿಕ ಭೂ ದಾಖಲೆಯಲ್ಲಿ ಬದಲಾವಣೆ ಕಂಡುಬಂದಿದೆ. ಮ್ಯುಟೇಶನ್ ನಮೂದು MR-1001 Pending ಇಂದ Recorded ಗೆ ಬದಲಾಗಿದೆ. ಇದರಿಂದ ಏನೋ ತಪ್ಪಾಗಿದೆ ಎಂದು ಅರ್ಥವಲ್ಲ. ದಯವಿಟ್ಟು ನಿಮ್ಮ ಸ್ಥಳೀಯ ಭೂ ದಾಖಲೆ ಕಚೇರಿಯಲ್ಲಿ ವಿಚಾರಿಸಿ.",
   hi:"KA-DEMO-001 की जमीन के सार्वजनिक भूमि रिकॉर्ड में बदलाव मिला है। म्यूटेशन एंट्री MR-1001 Pending से Recorded में बदली है। इसका मतलब यह नहीं कि कुछ गलत है। कृपया अपने स्थानीय भूमि रिकॉर्ड कार्यालय में जांच करें।"}}]}]};

const $=s=>document.querySelector(s);
const esc=s=>String(s??"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const fmt=ts=>ts?new Date(ts*1000).toLocaleString(lang==="en"?"en-IN":lang+"-IN",{dateStyle:"medium",timeStyle:"short"}):null;

function sketch(){return `<svg viewBox="0 0 400 104" preserveAspectRatio="xMidYMid slice" aria-hidden="true">
<defs><pattern id="g" width="22" height="22" patternUnits="userSpaceOnUse"><path d="M22 0H0V22" fill="none" stroke="var(--mint-2)" stroke-width="1"/></pattern></defs>
<rect width="400" height="104" fill="url(#g)"/>
<path d="M120 78 L170 22 L282 30 L300 80 Z" fill="var(--green-2)" fill-opacity=".22" stroke="var(--green)" stroke-width="2" stroke-dasharray="6 4"/>
<circle cx="170" cy="22" r="4" fill="var(--green)"/><circle cx="282" cy="30" r="4" fill="var(--green)"/><circle cx="300" cy="80" r="4" fill="var(--green)"/><circle cx="120" cy="78" r="4" fill="var(--green)"/>
<g transform="translate(205,46)"><circle r="13" fill="var(--green)"/><path d="M-5 0l3.5 3.5L6 -3.5" stroke="#fff" stroke-width="2.2" fill="none" stroke-linecap="round" stroke-linejoin="round"/></g></svg>`}

function render(){
  const t=T[lang];
  document.documentElement.lang=lang;
  document.querySelectorAll("[data-t]").forEach(e=>e.textContent=t[e.dataset.t]);
  document.querySelectorAll(".seg button").forEach(b=>b.setAttribute("aria-pressed",b.dataset.l===lang));
  const html=DATA.parcels.map((p,i)=>{
    const a=p.alerts[0], sev=a?a.severity:"none";
    const demo=DATA.demo, tag=demo?t.simTag:t.fixTag;
    const title=!a?t.none:(sev==="ops"?t.ops:t.chg);
    const body=!a?t.noneS:(sev==="ops"?t.opsS:a.changes.map(c=>summ(c,t)).join(" "));
    const last=demo?`${t.demoRun} <span class="tag sim">${t.sim}</span>`:(fmt(p.last_check)||t.never);
    return `<article class="card">
      <div class="sketch">${sketch()}</div>
      <div class="pad"><p class="eyebrow">${t.mine}</p>
        <div class="pid"><b>${esc(p.label)}</b><span class="tag ${demo?"sim":""}">${tag}</span></div>
        ${p.place||p.survey?`<p class="meta">${esc(p.place)}${p.survey?" · Sy. "+esc(p.survey):""}</p>`:""}
        <div class="guard">${t.guard.map(g=>`<span>${g}</span>`).join("")}</div></div>
      <div class="row"><span>${t.last}</span><span>${last}</span></div>
      ${p.confirmed_own?`<div class="row"><span>✓</span><span>${t.own}${p.watch_closely?" · "+t.watch:""}</span></div>`:""}
      <div style="height:16px"></div>
      <div class="status s-${sev==="low"?"medium":sev}"><div class="dot">${!a?"✓":sev==="ops"?"!":"Δ"}</div><div><h3>${title}</h3><p>${esc(body)}</p></div></div>
      ${a?`<button class="btn" data-open="${i}">${t.view}</button>`:""}
    </article>`}).join("");
  $("#parcels").innerHTML=html;
  document.querySelectorAll("[data-open]").forEach(b=>b.onclick=()=>openSheet(+b.dataset.open));
  if($("#sheet").classList.contains("open"))openSheet(cur);
}
function summ(c,t){const n=t.types[c.type];
  if(c.type==="owner_changed")return t.owner;
  if(c.type==="new_mutation")return `${n}: ${c.id} (${c.status}).`;
  return `${n} ${c.id?c.id+": ":""}${c.old} → ${c.new}.`}
function prettyDecision(d){try{const j=JSON.parse(d);return [j.action,j.recheck?"re-check this evening":null,j.source?"by "+j.source:null,j.reason].filter(Boolean).join(" · ")}catch(e){return d||"—"}}
let cur=0;
function openSheet(i){
  cur=i;const t=T[lang],p=DATA.parcels[i],a=p.alerts[0];
  const rows=a.changes.map(c=>c.type==="owner_changed"
    ?`<div class="msg">${t.owner}</div>`
    :c.type==="new_mutation"
    ?`<div class="diff"><div class="b"><small>${t.was}</small>—</div><div>→</div><div class="b new"><small>${t.types[c.type]}</small>${esc(c.id)} · ${esc(c.status)} · ${esc(c.date||"")}</div></div>`
    :`<div class="diff"><div class="b"><small>${t.types[c.type]}${c.id?" · "+esc(c.id):""} · ${t.was}</small>${esc(c.old)}</div><div>→</div><div class="b new"><small>${t.now}</small>${esc(c.new)}</div></div>`).join("");
  const hist=p.alerts.map(x=>`<li><b>${t.sev[x.severity]||x.severity}</b> — ${esc(x.changes.map(c=>t.types[c.type]).join(", ")||t.ops)}<small>${fmt(x.at)||t.sim}</small></li>`).join("");
  $("#panel").innerHTML=`<button class="icon close" id="x" aria-label="${t.close}">✕</button>
   <span class="chip c-${a.severity}">${t.sev[a.severity]||a.severity}</span>
   <h3>${t.details}</h3>${rows}
   <p class="eyebrow" style="margin-top:18px">${t.say}</p>
   <div class="msg" lang="${lang}">${esc(a.messages[lang])}</div>
   <button class="listen" id="say">${t.listen}</button>
   <p class="eyebrow" style="margin-top:20px">${t.decision}</p>
   <div class="msg">${esc(prettyDecision(a.decision))}</div>
   <p class="eyebrow" style="margin-top:20px">${t.hist}</p><ol class="tl">${hist}</ol>
   <p class="note">${t.foot}</p>`;
  $("#sheet").classList.add("open");
  $("#x").onclick=closeSheet; $("#x").focus();
  $("#say").onclick=()=>{try{speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(a.messages[lang]);u.lang=VOICE[lang];speechSynthesis.speak(u)}catch(e){}};
}
function closeSheet(){$("#sheet").classList.remove("open");try{speechSynthesis.cancel()}catch(e){}}
$("#sheet").onclick=e=>{if(e.target.id==="sheet")closeSheet()};
document.addEventListener("keydown",e=>{if(e.key==="Escape")closeSheet()});
document.querySelectorAll(".seg button").forEach(b=>b.onclick=()=>{lang=b.dataset.l;try{localStorage.setItem("lrw-lang",lang)}catch(e){}render()});
$("#theme").onclick=()=>{const r=document.documentElement,d=getComputedStyle(r).getPropertyValue("--bg").trim()==="#0d1711";r.dataset.theme=d?"light":"dark"};

fetch("/api/state").then(r=>r.ok?r.json():Promise.reject()).then(d=>{DATA=d.parcels.length?d:DEMO}).catch(()=>{DATA=DEMO}).finally(render);
</script>
</body>
</html>
